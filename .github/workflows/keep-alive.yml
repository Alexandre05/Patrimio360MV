name: Supabase Keep Alive

on:
  push:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -f -s -o /dev/null -w "Status HTTP: %{http_code}\n" -X GET "https://iqigbdzncjswpluhvtff.supabase.co/rest/v1/" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
